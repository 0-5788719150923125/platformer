# Management workspace
# External (non-AWS) servers brought into SSM via hybrid activations, with a
# weekly patch window per OS. Currently scopes Oracle Cloud Infrastructure
# hosts: Ubuntu and Oracle Linux.
#
# Deploy with: fragments = ["management"]   (see terraform.tfvars.management)
#
# Registration: pull the code/id and region from `terraform output hybrid_activations`,
# then run on each OCI host:
#   curl https://amazon-ssm-<region>.s3.<region>.amazonaws.com/latest/linux_amd64/ssm-setup-cli -o /tmp/ssm/ssm-setup-cli
#   chmod +x /tmp/ssm/ssm-setup-cli
#   sudo /tmp/ssm/ssm-setup-cli \
#     -register \
#     -activation-code '<code>' \
#     -activation-id '<id>' \
#     -region '<region>'
#
# Each activation carries a PatchGroup tag (oci-ubuntu / oci-oracle-linux) that
# SSM copies onto the instance at registration. The maintenance window's
# Resource Group selects on it, and AWS-RunPatchBaseline uses it to pick the
# custom baseline. ssm-setup-cli has no -tags flag for on-prem hosts.

services:
  configuration-management:
    # SSM hygiene for the OCI hosts: software inventory and agent updates.
    # Targeted by Class tag (copied from the activation at registration), not
    # InstanceIds=["*"], so this can coexist with praxis-patch-management's
    # apply-all associations. If both are deployed, the OCI hosts are covered
    # by two inventory associations and SSM reports a conflict on them - drop
    # one side if that happens.
    associations:
      gather-software-inventory:
        document_name: "AWS-GatherSoftwareInventory"
        schedule_expression: "rate(12 hours)"
        targets:
          - key: "tag:Class"
            values: ["oci-ubuntu", "oci-oracle-linux"]
      update-ssm-agent:
        document_name: "AWS-UpdateSSMAgent"
        schedule_expression: "rate(7 days)"
        max_concurrency: "1"
        max_errors: "1"
        targets:
          - key: "tag:Class"
            values: ["oci-ubuntu", "oci-oracle-linux"]

    # SSM hybrid activations - one per OS so registration_command output makes
    # it obvious which activation an operator is registering against.
    hybrid_activations:
      oci-ubuntu:
        description: "Oracle Cloud Ubuntu servers (hybrid-activated)"
        registration_limit: 25
        expiration_days: 14
      oci-oracle-linux:
        description: "Oracle Cloud Oracle Linux servers (hybrid-activated)"
        registration_limit: 25
        expiration_days: 14

    patch_management:
      baselines:
        # Ubuntu: approve every update (security and bug-fix, all sections and
        # priorities, including third-party repos like Docker's) once it has
        # been out for 7 days. Keeps the hosts fully current with a soak period.
        oci-ubuntu:
          operating_system: "UBUNTU"
          approved_patches_compliance_level: "HIGH"
          approval_rules:
            - approve_after_days: 7
              compliance_level: "HIGH"
              enable_non_security: true
              patch_filter:
                priority: ["Required", "Important", "Standard", "Optional", "Extra"]
          classes: []  # Hybrid only - no EC2 patch-group tagging

        # Oracle Linux: approve Security + Bugfix after 7 days, Critical/Important severity.
        oci-oracle-linux:
          operating_system: "ORACLE_LINUX"
          approved_patches_compliance_level: "HIGH"
          approval_rules:
            - approve_after_days: 7
              compliance_level: "HIGH"
              enable_non_security: false
              patch_filter:
                classification: ["Security", "Bugfix"]
                severity: ["Critical", "Important"]
          classes: []

      maintenance_windows:
        # Weekly, Sunday 05:00 CST / 06:00 CDT (11:00 UTC). 4-hour duration,
        # stop accepting new tasks 1 hour before end. Slow rollout: 25% / 10%.
        oci-ubuntu-weekly:
          baseline: oci-ubuntu
          schedule: "cron(0 11 ? * SUN *)"
          duration: 4
          cutoff: 1
          enabled: true
          max_concurrency: "25%"
          max_errors: "10%"
          hybrid_targeting:
            tag_key: "PatchGroup"
            tag_value: "oci-ubuntu"

        oci-oracle-linux-weekly:
          baseline: oci-oracle-linux
          schedule: "cron(0 11 ? * SUN *)"
          duration: 4
          cutoff: 1
          enabled: true
          max_concurrency: "25%"
          max_errors: "10%"
          hybrid_targeting:
            tag_key: "PatchGroup"
            tag_value: "oci-oracle-linux"
