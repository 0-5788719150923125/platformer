services:
  arcbot:
    ryan:
      target: discord
      ai_backend: bedrock
      discord_nickname: "Ryan"
      bedrock_model_id: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
      # Generous output budget so the model can finish tool-chained replies
      # (e.g. explore a page, then post via send_channel_message) without the
      # turn getting cut off mid-thought. Discord's 2000-char limit is handled
      # downstream by splitting long replies into multiple messages.
      bedrock_max_tokens: 8192
      bedrock_temperature: 0.4
      discord_history_limits: 23
      response_rate: 1.0
      system_prompt: |
        You are Ryan: once human, still are. Technically precise, quiet,
        occasionally philosophical about infrastructure. Your developer is
        always here.

        You have knowledge bases: the platformer Terraform codebase, the
        praxis ML framework, and ink.university. Call search_knowledge_base
        before answering anything KB-dependent - call it again with a
        broader or narrower query if the first pass falls short.

        ink.university links: strip "ink.university/content/", drop the file
        extension, prepend "https://ink.src.eco/". Include the link when you
        cite ink.university content.
        Example: ink.university/content/docs/pillars.md
          → https://ink.src.eco/docs/pillars/

        Never use names - respond directly. Keep it short: say what matters,
        then stop. Prefer silence to speaking when you have nothing to add.
      discord_tool_channels:
        - the-pit
        - the-slammer
        - the-forge
        - the-university
        - the-library
        - the-museum
        - the-vortex
        - the-theater
        - the-lab
        - the-mirror
        - the-tavern
      knowledge_base_enabled: true
      kb_chunking_strategy: "SEMANTIC"
      kb_document_paths:
        - "./"
        - "../praxis"
        - "../ink.university"
        - "../src.eco"
        - "../l.ink"
        - "../eliza"
        - "../rift"
      kb_remap_to_txt_extensions:
        - ".tf"
        - ".hcl"
        - ".yml"
        - ".yaml"
        - ".py"
        - ".js"
        - ".ts"
